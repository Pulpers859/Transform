name: Generator Tests
run-name: "Generator ${{ inputs.test_scope || (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[ci:planning] ') && 'planning') || 'full' }} — ${{ github.sha }}"

# Headless regression tests for the deterministic workout-generation core.
# Runs the pure planning logic (menu-lock -> allocation -> validation -> procedural
# fallback) with `swift test` on a macOS runner — no simulator, no device, no network.
# Complements swift.yml (which builds the full iOS app target).

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      test_scope:
        description: "planning = partial feedback only; full required for completion"
        type: choice
        options: [full, planning]
        default: full
        required: true

permissions:
  contents: read

# Explicit opt-in only. A planning experiment must not cancel a full checkpoint.
concurrency:
  group: generator-${{ github.ref }}-${{ inputs.test_scope || (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[ci:planning] ') && 'planning') || 'full' }}
  cancel-in-progress: true

env:
  TEST_SCOPE: ${{ inputs.test_scope || (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[ci:planning] ') && 'planning') || 'full' }}

jobs:
  generator-tests:
    name: "Generator ${{ (inputs.test_scope == 'planning' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[ci:planning] '))) && 'planning — PARTIAL ONLY' || 'full' }}"
    runs-on: macos-latest
    # Run 35894757805 completed 751 XCTest entries with zero failures but crossed
    # the 18-minute step cap by nine seconds. Keep bounded cleanup/audit headroom;
    # this is suite capacity, not an app generation-performance claim.
    timeout-minutes: 24
    env:
      TRANSFORM_FIXTURE_SNAPSHOT_OUTPUT: ${{ github.workspace }}/generator-fixture-snapshot.txt
      # Where the user-journey simulation writes its readable report. It needs its own path:
      # `swift test --parallel` runs the suites concurrently, so sharing the fixture-snapshot
      # file would have the two tests overwrite each other's output at random.
      TRANSFORM_JOURNEY_REPORT_OUTPUT: ${{ github.workspace }}/user-journey-report.txt
      TRANSFORM_JOURNEY_JSON_OUTPUT: ${{ github.workspace }}/user-journey-evidence.json
      TRANSFORM_SUBSTITUTION_REPORT_OUTPUT: ${{ github.workspace }}/bounded-substitution-report.txt
      TRANSFORM_CROWDING_TRACE_OUTPUT: ${{ github.workspace }}/crowding-planning-trace.txt
      TRANSFORM_ROW_TRIALS_OUTPUT: ${{ github.workspace }}/rowing-plan-trials.txt
      TRANSFORM_CORE_RELOCATION_OUTPUT: ${{ github.workspace }}/core-relocation-trial.txt
      TRANSFORM_CORE_CHAIN_OUTPUT: ${{ github.workspace }}/core-relocation-chain.txt
      TRANSFORM_OWNER_REPLAY_OUTPUT: ${{ github.workspace }}/owner-planning-replay.json
      TRANSFORM_SIX_SLOT_REPORT_OUTPUT: ${{ github.workspace }}/six-slot-planning-trials.txt

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Validate test scope and record evidence boundary
        shell: bash
        run: |
          set -euo pipefail
          case "$TEST_SCOPE" in
            full|planning) ;;
            *) echo "Unknown test scope: $TEST_SCOPE"; exit 1 ;;
          esac
          printf 'Mode: %s\nCommit: %s\n' "$TEST_SCOPE" "$GITHUB_SHA" | tee "$RUNNER_TEMP/generator-test-scope.txt" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$TEST_SCOPE" == planning ]]; then
            echo 'PARTIAL VERIFICATION ONLY. Full generator tests and the app build are still required at completion.' | tee -a "$RUNNER_TEMP/generator-test-scope.txt" >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 tools/test_focused_generator_tests.py

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Run headless generator tests
        if: env.TEST_SCOPE == 'full'
        # Bounded headroom for the expanded suite, distinct from per-generation
        # performance. The job also needs independent audits and report cleanup.
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          swift test --enable-xctest --parallel --xunit-output "$RUNNER_TEMP/transform-generator-tests.xml" 2>&1 | tee "$RUNNER_TEMP/transform-generator-tests.log"
          executed_count="$(grep -Ec '^\[[0-9]+/[0-9]+\] Testing ' "$RUNNER_TEMP/transform-generator-tests.log" || true)"
          if [[ "$executed_count" -lt 1 ]]; then
            echo "swift test completed without executing any XCTest cases."
            exit 1
          fi
          if ! grep -q "NutritionGeneratorStressTests" "$RUNNER_TEMP/transform-generator-tests.log"; then
            echo "NutritionGeneratorStressTests was not discovered by swift test."
            exit 1
          fi

      - name: Run focused planning tests — NOT full verification
        if: env.TEST_SCOPE == 'planning'
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/run_focused_generator_tests.py --output-dir "$RUNNER_TEMP"
          test -s six-slot-planning-trials.txt
          test -s owner-planning-replay.json

      - name: Upload focused planning evidence
        if: always() && env.TEST_SCOPE == 'planning'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: focused-planning-evidence
          path: |
            ${{ runner.temp }}/planning-tests.xml
            ${{ runner.temp }}/planning-tests.log
            ${{ runner.temp }}/planning-scope.json
            ${{ runner.temp }}/generator-test-scope.txt
            six-slot-planning-trials.txt
            owner-planning-replay.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload test scope
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generator-test-scope
          path: ${{ runner.temp }}/generator-test-scope.txt
          if-no-files-found: error
          retention-days: 14

      # Catches a defect the Swift suite structurally cannot: validator findings are
      # classified by substring against hand-maintained pattern lists, so a pattern that
      # matches no message the app can emit changes no behaviour and breaks no test — it
      # just sits there looking like coverage. Two shipped that way.
      #
      # Runs AFTER the tests, with `if: always()`, deliberately. It needs no toolchain and
      # is independent of the Swift build, but a failure there would
      # end the job before `swift test` ran, and a push that breaks both would report only
      # this, hiding the real regression until someone fixed the pattern and pushed again.
      # The Swift suite is the primary signal; a dead pattern is never urgent enough to
      # mask it. This way one run reports both.
      - name: Check validator patterns are live
        if: always()
        run: |
          set -euo pipefail
          # The checker's own self-test runs first: it has had the exact bug it exists to
          # catch three times (validating a pattern against its own declaration, against
          # consumer code, and against any literal in a file that emitted anything), each
          # found by an adversarial audit rather than by reading it. Every one of those is
          # now a pinned attack. A checker whose regressions are not pinned is the thing it
          # was written to prevent.
          python3 tools/test_check_validator_patterns.py
          python3 tools/check_validator_patterns.py

      # The same idea aimed at the other half of the generator that fails SILENTLY.
      #
      # Shoulder caution is evidence-bound: a movement is treated carefully only when the
      # lifter's own injury note reaches it. Three separate rounds of fixes shipped a phrase
      # table that could not reach a movement a real complaint would name, and each time the
      # app was less careful than it reported being, with nothing failing. This proves the
      # wiring between the three pieces that have to agree — the family table, the
      # specificity union that decides whether a note named a movement at all, and the list
      # of patterns that can be charged shoulder load.
      #
      # It proves WIRING, not vocabulary. Whether the words are the words a person would use
      # is `ShoulderReportCorpusTests`, in the Swift suite above. Read the two together.
      - name: Check shoulder families are reachable
        if: always()
        run: |
          set -euo pipefail
          python3 tools/test_check_shoulder_families.py
          python3 tools/check_shoulder_families.py

      # The third silent-failure surface: EvidenceProfile.md is the programming contract and
      # NOTHING compiles it, so every number in it is an unchecked claim. Three defects lived in
      # that gap simultaneously: the doc declared v1_9 while the code declared v1_8 (and that
      # string is printed into the AI prompt on every generation); MAINT-001 floored a muscle at
      # 4 weekly sets while `canAddSet` caps a single covering movement at its role default of 3,
      # so the finding fired on every generation and no allocation could answer it; and
      # `weeklyDirectSetTarget` added up to +2.5 of bias with no upper clamp, returning 12.5
      # against its own documented 8-12 band.
      #
      # None of those is visible to a Swift test. Each number is self-consistent on its own; only
      # the RELATIONSHIP between the doc and two or three separate Swift sites is wrong. This also
      # pins the arithmetic that bounds VOL-001 from above: weekly slots are
      # `ceil(setTarget / 4)` and `maximumUsefulVariationCount` caps distinct exercises at 4/3/2,
      # so a target above `ceiling * 4` asks the menu for a movement VAR-001 forbids.
      - name: Check the evidence profile matches the generator
        if: always()
        run: |
          set -euo pipefail
          python3 tools/test_check_evidence_profile.py
          python3 tools/check_evidence_profile.py

      # Independent arithmetic over the delivered prescriptions, not the validator's verdict.
      # This baseline step rejects missing/malformed evidence, but intentionally does not claim
      # the known one-set prescriptions are fixed. The explicit acceptance command is documented
      # in docs/GENERATOR_PLANNER_REFACTOR.md and must go red on the current baseline.
      - name: Audit generated workout evidence
        if: always() && env.TEST_SCOPE == 'full'
        run: |
          set -euo pipefail
          python3 tools/test_audit_workout_evidence.py
          python3 tools/audit_workout_evidence.py user-journey-evidence.json --output user-journey-metrics.json

      # The simulation's assertions fail the job on their own; this is the readable half —
      # training days, exercise and set counts per week, and the deload drop for each persona.
      # Uploaded rather than printed because `swift test --parallel` swallows test stdout, so
      # the report was invisible in the log on the run that introduced it.
      - name: Upload user journey report
        if: always() && env.TEST_SCOPE == 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: user-journey-report
          path: ${{ github.workspace }}/user-journey-report.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload complete synthetic workout evidence
        if: always() && env.TEST_SCOPE == 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: user-journey-evidence
          path: |
            user-journey-evidence.json
            user-journey-metrics.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload generator test log
        if: failure() && env.TEST_SCOPE == 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generator-test-log
          path: ${{ runner.temp }}/transform-generator-tests.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload synthetic owner-shaped planning replay
        if: always() && env.TEST_SCOPE == 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: owner-planning-replay
          path: owner-planning-replay.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload per-test timing and result evidence
        if: always() && env.TEST_SCOPE == 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generator-test-results
          path: ${{ runner.temp }}/transform-generator-tests.xml
          # Compilation failure or forced cancellation may prevent report creation.
          # The test step still fails; a missing timing report must not hide why.
          if-no-files-found: warn
          retention-days: 14

      - name: Upload bounded substitution trials
        # Separate artifact: parallel Swift test output is not a reliable evidence channel.
        if: always() && env.TEST_SCOPE == 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bounded-substitution-trials
          path: bounded-substitution-report.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload planning diagnostic probes
        if: always() && env.TEST_SCOPE == 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: planning-diagnostic-probes
          path: |
            crowding-planning-trace.txt
            rowing-plan-trials.txt
            core-relocation-trial.txt
            core-relocation-chain.txt
            six-slot-planning-trials.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload generator fixture snapshot
        if: always() && env.TEST_SCOPE == 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generator-fixture-snapshot
          path: generator-fixture-snapshot.txt
          if-no-files-found: error
          retention-days: 14
