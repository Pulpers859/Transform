name: Generator Troubleshooting

on:
  workflow_dispatch:
    inputs:
      run_live_workout:
        description: "Run the bounded workout Anthropic check (API-billed)"
        type: boolean
        required: true
        default: false
      run_live_nutrition:
        description: "Run the bounded one-week nutrition Anthropic check (API-billed)"
        type: boolean
        required: true
        default: false
      confirm_api_usage:
        description: "Type RUN_LIVE_AI to authorize any selected live job"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: generator-troubleshooting
  cancel-in-progress: false

jobs:
  deterministic-replay:
    runs-on: macos-latest
    timeout-minutes: 12
    env:
      TRANSFORM_FIXTURE_SNAPSHOT_OUTPUT: ${{ github.workspace }}/generator-fixture-snapshot.txt

    steps:
      - uses: actions/checkout@v5

      - name: Run captured generator regression
        run: swift test --enable-xctest --filter TransformGeneratorCoreTests.GeneratorTroubleshootingTests/testFiveMaintenanceErrorFixtureStaysResolved

      - name: Verify deterministic replay executed
        run: test -s generator-fixture-snapshot.txt

      - name: Upload deterministic snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generator-fixture-snapshot
          path: generator-fixture-snapshot.txt
          if-no-files-found: error
          retention-days: 14

  live-workout-contract:
    if: ${{ inputs.run_live_workout && inputs.confirm_api_usage == 'RUN_LIVE_AI' }}
    needs: deterministic-replay
    runs-on: macos-latest
    timeout-minutes: 12
    env:
      TRANSFORM_RUN_LIVE_ANTHROPIC_SMOKE: "1"
      TRANSFORM_HEADLESS_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TRANSFORM_LIVE_SMOKE_OUTPUT: ${{ github.workspace }}/live-generator-report.txt

    steps:
      - uses: actions/checkout@v5

      - name: Run one bounded live structured generation
        run: swift test --enable-xctest --filter TransformGeneratorCoreTests.GeneratorTroubleshootingTests/testLiveWeekOneStructuredContract

      - name: Verify live contract check executed
        run: test -s live-generator-report.txt

      - name: Upload redacted troubleshooting verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-generator-report
          path: live-generator-report.txt
          if-no-files-found: error
          retention-days: 7

  live-nutrition-contract:
    if: ${{ inputs.run_live_nutrition && inputs.confirm_api_usage == 'RUN_LIVE_AI' }}
    needs: deterministic-replay
    runs-on: macos-latest
    timeout-minutes: 12
    env:
      TRANSFORM_RUN_LIVE_ANTHROPIC_SMOKE: "1"
      TRANSFORM_HEADLESS_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TRANSFORM_NUTRITION_LIVE_SMOKE_OUTPUT: ${{ github.workspace }}/live-nutrition-generator-report.txt

    steps:
      - uses: actions/checkout@v5

      - name: Run one bounded live nutrition generation
        run: swift test --enable-xctest --filter TransformGeneratorCoreTests.NutritionGeneratorStressTests/testLiveNutritionWeekOneStructuredContract

      - name: Verify live nutrition contract check executed
        run: test -s live-nutrition-generator-report.txt

      - name: Upload redacted nutrition verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-nutrition-generator-report
          path: live-nutrition-generator-report.txt
          if-no-files-found: error
          retention-days: 7
