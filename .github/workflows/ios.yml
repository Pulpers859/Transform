      #     xcodebuild \
      #       -project "$PROJECT" \
      #       -scheme "$SCHEME" \
      #       -configuration Debug \
      #       -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
      #       CODE_SIGNING_ALLOWED=NO \
      #       test
