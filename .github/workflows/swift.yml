# Syntax smoke-check for the flat Swift source snapshot in this repo.
#
# There is no Package.swift or .xcodeproj checked in, so `swift build` /
# `swift test` can never succeed here — the previous workflow failed on every
# push and provided zero signal. Full type-checking requires the Xcode project
# (UIKit/SwiftUI/SwiftData targets); parsing each source file still catches
# syntax errors early.

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  syntax-check:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Parse all Swift sources
      run: |
        set -euo pipefail
        status=0
        for file in *.swift; do
          echo "Parsing $file"
          xcrun swiftc -parse "$file" || status=1
        done
        exit $status
